name: Claude Code

# @claude メンション方式
# issue / PR コメント / PR レビューに「@claude」を含めると Claude が起動し、
# 内容に応じてコード実装・PR作成・修正などを行う。
#
# 前提（リポジトリ管理者が一度だけ設定）:
#   1. Claude GitHub App をこのリポジトリにインストール
#      https://github.com/apps/claude
#   2. Claude サブスク（Pro/Max/Team/Enterprise）の OAuth トークンを発行
#      ローカルの Claude Code で `claude setup-token` を実行して取得（有効期限1年）
#   3. リポジトリ Secrets に CLAUDE_CODE_OAUTH_TOKEN を登録
#      Settings → Secrets and variables → Actions
#   ※ API 従量課金（ANTHROPIC_API_KEY）ではなくサブスク枠で動く認証方式

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 本文・コメント・レビューに @claude が含まれるときだけ実行する
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # prompt を省略すると @claude メンションへの応答モードになる
          claude_args: "--max-turns 20 --model claude-opus-4-8"
