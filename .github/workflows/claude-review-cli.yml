name: Claude Review (CLI / self-built)

# 方法3: Claude Code CLI を headless mode (claude -p) で直接動かす自前レビュー。
# 差分を CLI に渡してレビュー文を生成し、gh CLI で PR コメントとして投稿する。
# 公式 Action を使わず、プロンプト・投稿方法を完全に自前で制御したい場合の構成。
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-cli-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cli-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate review with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # PR の差分を抽出（バイナリは除外、100KB 上限でトークン超過を防ぐ）
          git diff "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)*.lock' | head -c 102400 > pr.diff
          if [ ! -s pr.diff ]; then
            echo "差分がないためレビューをスキップします。" > review.md
            exit 0
          fi

          # プロンプトをファイルに書き出すことでシェル引数のクォート問題を回避する
          cat > prompt.txt <<'EOF'
          あなたは Voice Insight プロジェクトのコードレビュアーです。
          標準入力で渡される git diff を日本語でレビューし、Markdown で出力してください。

          プロジェクト固有の必須チェック観点（要件定義書 documents/10_要件定義/ に準拠）:
          - データを一切永続化していないか（録音音声・文字起こし・評価結果。NF-03）
          - ユーザー管理／ログイン／履歴を追加していないか
          - 対象が日本語のみか（NF-02） / 録音は最大5分か（F-01）
          - Phase1 スコープ（PREP 構成評価のみ／音声特徴分析は対象外）を逸脱していないか
          - プライバシー表示（NF-04）とエラー時の再録音導線（NF-06）があるか

          一般観点（バグ・セキュリティ・可読性・テスト不足）も確認すること。
          出力フォーマット:
          ## レビュー概要
          （全体所感を2〜3行）
          ## 指摘事項
          - [致命/重要/軽微] ファイル:行 — 指摘内容と修正案
          指摘がなければ「指摘なし」と書くこと。
          EOF

          claude -p "$(cat prompt.txt)" --output-format text < pr.diff > review.md

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## 🤖 Claude レビュー（CLI / 自前ワークフロー）"
            echo ""
            cat review.md
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
