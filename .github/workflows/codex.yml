name: Codex

# @codex メンション方式
# issue / PR コメント / PR レビューに「@codex」を含めると Codex が起動し、
# 内容に応じてコード実装・修正・回答などを行う。
#
# 前提（リポジトリ管理者が一度だけ設定）:
#   1. OpenAI Platform で API キーを発行（https://platform.openai.com/api-keys）
#   2. リポジトリ Secrets に OPENAI_API_KEY を登録
#      Settings → Secrets and variables → Actions
#   ※ この Action 認証は API 従量課金（Responses API）。ChatGPT サブスク枠で動かす
#      公式の @codex 連携を使いたい場合は CODEX_REVIEW_SETUP.md の「方法2」を参照。

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  codex:
    # 本文・コメント・レビューに @codex が含まれるときだけ実行する
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@codex')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # workspace-write で Codex が変更を適用できるようにする
          sandbox: workspace-write
          prompt: |
            あなたは ${{ github.repository }} の開発を手伝う Codex エージェントです。
            以下のメンション本文の依頼に日本語で対応してください。

            依頼本文:
            ----
            ${{ github.event.comment.body }}${{ github.event.issue.body }}${{ github.event.review.body }}
            ----

            このリポジトリ（Voice Insight）の Phase1 制約を必ず守ること:
            データを永続化しない（NF-03）／ユーザー管理を作らない／日本語のみ（NF-02）／
            録音は最大5分（F-01）／PREP 構成評価のみで音声特徴分析は対象外。

      - name: Post Codex response
        if: steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber =
              (context.payload.issue && context.payload.issue.number) ||
              (context.payload.pull_request && context.payload.pull_request.number);
            if (!issueNumber) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: "## 🤖 Codex\n\n" + process.env.CODEX_FINAL_MESSAGE,
            });
